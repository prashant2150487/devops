name: React ci cd pipeline
on:
  push:
    branches:
      - main
      - dev
  pull_request:
    branches:
      - main
      - dev
jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [22.x]
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: ${{ matrix.node-version }}
        cache: 'npm'
    - name: Install dependencies
      run: npm ci
    - name: Run linter  
      run: npm run lint
    # - name: Run tests
    #   run: npm run test
    - name: Build project
      run: npm run build
    - name: upload build artifacts
      run: actions/upload-artifacts@v4
      with:
        name: build-${{ matrix.node-version }}
        path: dist/
        retention-days: 7




      


  
    
    




      